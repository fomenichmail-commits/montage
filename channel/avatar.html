<html><head><link rel="stylesheet" href="common.css"><style>
body{width:800px;height:800px;overflow:hidden;background:var(--paper);display:grid;place-items:center}
.c{width:800px;height:800px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#eef3fb 60%,#dbe5f5);position:relative;display:grid;place-items:center;overflow:hidden}
.c::before{content:"";position:absolute;inset:26px;border-radius:50%;border:22px solid var(--gold)}
.m{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateY(-6px)}
.sc{font-family:Oswald;font-weight:700;font-size:330px;line-height:.9;color:var(--navy);text-shadow:12px 12px 0 var(--gold);letter-spacing:-6px}
.spb{font-family:Oswald;font-weight:700;font-size:110px;line-height:1.15;color:#fff;background:var(--red);padding:0 34px;transform:skewX(-12deg)}
</style></head><body><div class="c"><div class="m"><span class="sc">SC</span><span class="spb">SPB</span></div></div></body></html>
